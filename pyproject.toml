[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-analyzer"
version = "0.1.0"
description = "Local lyrics library and expression analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit==1.67.0", "SudachiPy==0.7.0", "SudachiDict-core==20261015"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
